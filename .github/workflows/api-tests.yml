name: API Automation Tests

on:
  # 1. 代码推送到主分支时自动触发回归测试
  push:
    branches: [ main, master ]
  # 2. 提 Pull Request 时自动拦截缺陷（质量门禁）
  pull_request:
    branches: [ main, master ]
  # 3. 每天北京时间 09:00（UTC 01:00）定时巡检
  schedule:
    - cron: '0 1 * * *'
  # 4. 支持在 GitHub Actions 页面一键手动触发，并可选择用例标签
  workflow_dispatch:
    inputs:
      marker:
        description: '选择要运行的用例集 (all / smoke / negative)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - negative

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 3.11 并开启 pip 缓存
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装测试框架依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 执行 Pytest 接口自动化测试
        env:
          TEST_ENV: test
        run: |
          if [ "${{ inputs.marker }}" = "smoke" ]; then
            pytest -m smoke --alluredir=reports/allure-results
          elif [ "${{ inputs.marker }}" = "negative" ]; then
            pytest -m negative --alluredir=reports/allure-results
          else
            pytest --alluredir=reports/allure-results
          fi

      - name: 5. 上传 HTML 与 Allure 测试报告（无论成败均保留现场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-${{ github.run_number }}
          path: |
            reports/report.html
            reports/allure-results
          retention-days: 14

      - name: 6. 失败时推送飞书/钉钉 Webhook 告警（配置 Secrets 后自动生效）
        if: failure() && secrets.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"msg_type":"text","content":{"text":"[自动化测试告警] 接口回归失败！请查看 GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}'
