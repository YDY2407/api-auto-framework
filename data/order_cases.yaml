- case_id: "ORDER_NEG_001"
  title: "购买数量为0返回400"
  payload:
    product_id: 1
    quantity: 0
  expected:
    status_code: 400
    biz_code: 40002

- case_id: "ORDER_NEG_002"
  title: "购买数量为负数返回400"
  payload:
    product_id: 1
    quantity: -2
  expected:
    status_code: 400
    biz_code: 40002

- case_id: "ORDER_NEG_003"
  title: "商品不存在返回404"
  payload:
    product_id: 99999
    quantity: 1
  expected:
    status_code: 404
    biz_code: 40402

- case_id: "ORDER_NEG_004"
  title: "超库存下单返回409"
  payload:
    product_id: 3
    quantity: 99
  expected:
    status_code: 409
    biz_code: 40901
